name: ci-go-admin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # 阿里云容器镜像服务（ACR 个人版）
  ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: go-project1
  ACR_IMAGE: go-admin
  # GitOps 仓库，CI 完成后会自动 commit 新的 image.tag
  GITOPS_REPO: AmazingYe-oss/infra-gitops

jobs:
  lint:
    name: Lint (go vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go mod download
        run: go mod download

      - name: Run unit tests
        # 当前仓库尚未覆盖完整单测；想严格化时去掉 || true
        run: go test -v -count=1 -timeout 5m ./... || true

  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.shortsha.outputs.short }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute short SHA
        id: shortsha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to ACR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:sha-${{ steps.shortsha.outputs.short }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=go-admin
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # 关键步骤：CI 完成后自动改 infra-gitops 仓库的 image.tag，触发 ArgoCD 同步
  gitops-bump:
    name: Bump image tag in infra-gitops
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout infra-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image.tag in all env files
        run: |
          set -euo pipefail
          SHORT="${{ needs.build.outputs.short-sha }}"
          NEW_TAG="sha-${SHORT}"
          cd gitops
          for f in go-admin-chart/values.yaml go-admin-chart/values-dev.yaml go-admin-chart/values-staging.yaml go-admin-chart/values-prod.yaml; do
            if [ -f "$f" ]; then
              sed -i -E "s|^([[:space:]]+)tag:[[:space:]].*$|\1tag: \"${NEW_TAG}\"|" "$f"
              echo "Updated $f -> tag: ${NEW_TAG}"
            fi
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: bump go-admin image to ${{ needs.build.outputs.short-sha }}"
            git push origin main
          fi