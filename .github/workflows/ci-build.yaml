name: GoAdmin Full CI Pipeline

# 触发规则
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# 最小权限：默认只读，构建推送时按需扩展
permissions:
  contents: read

# 同一分支/同一次 PR 的旧任务自动取消，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # =========【请自行修改这几项】=========
  ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_REPO: go-project1/go-admin
  IMAGE_FULL_NAME: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPO }}
  GO_VERSION: "1.24"
  GOLANGCI_LINT_VERSION: v1.61.0

jobs:
  ci:
    runs-on: ubuntu-latest

    # 推送镜像到 ACR 时需要写 Packages 权限
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 安装 Go 环境（v5 已移除 cache 参数，依赖缓存交给独立步骤）
      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # 3. 缓存 Go 依赖包（升级到 v4，避免与 setup-go 旧参数冲突）
      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 4. 下载依赖 + 校验哈希，防止依赖被篡改
      - name: Download and verify go modules
        run: |
          go mod download
          go mod verify

      # 5. 安装 goimports（goimports 内部已含 gofmt，仅保留一个即可）
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      # 6. 自动格式化代码（仅用 goimports，避免与 gofmt 重复）
      - name: Auto format code
        run: |
          echo "执行 goimports 格式化（含 gofmt + import 排序）..."
          goimports -w .

      # 7. 代码格式化校验（未格式化直接失败）
      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ 存在未格式化的代码文件："
            gofmt -l .
            exit 1
          fi

      # 8. 静态代码检查（固定 golangci-lint 版本，避免 latest 带来的不可复现问题）
      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      # 9. 单元测试 + 覆盖率 + 竞态检测
      - name: Run Unit Test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # 10. 上传覆盖率产物，便于在 PR 中查看
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      # 11. 构建产物归档（Go 二进制，方便下载验证）
      - name: Build Go binary
        run: |
          mkdir -p artifacts
          go build -o artifacts/go-admin ./...
      - name: Upload Go binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-admin-binary
          path: artifacts/

      # ====================== 前置检查全部通过，才进入镜像构建推送 ======================

      # 12. 登录阿里云 ACR（PR 阶段跳过）
      - name: Login to Aliyun ACR
        if: github.event_name == 'push'
        uses: aliyun/acr-login@v1
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ACR_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ACR_ACCESS_KEY_SECRET }}
        with:
          registry: ${{ env.ACR_REGISTRY }}

      # 13. 登录通用 Registry（如需推送到 GHCR 等；当前 ACR 用 acr-login 即可，本步可选）
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 14. 计算镜像标签（短 SHA + latest + 语义化版本）
      - name: Compute image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          TAGS="${{ env.IMAGE_FULL_NAME }}:$SHORT_SHA ${{ env.IMAGE_FULL_NAME }}:latest"

          # 如果是 v* tag 触发，额外打语义化版本号
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            TAGS="$TAGS ${{ env.IMAGE_FULL_NAME }}:$VERSION"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 15. 验证 Dockerfile 存在，避免构建时报莫名其妙的错
      - name: Verify Dockerfile exists
        if: github.event_name == 'push'
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ 仓库根目录未找到 Dockerfile"
            exit 1
          fi

      # 16. 构建并推送 Docker 镜像（启用 BuildKit + GHA 缓存加速）
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 17. 镜像漏洞扫描（高危/严重漏洞则失败，阻断推送产物）
      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_FULL_NAME }}:${{ steps.tags.outputs.tags }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
