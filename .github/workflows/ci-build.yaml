name: GoAdmin Full CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
      IMAGE_REPO: go-project1/go-admin
      GO_VERSION: "1.24"
      GOLANGCI_LINT_VERSION: v2.12.2

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download and verify go modules
        run: |
          go mod download
          go mod verify

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Auto format code
        run: |
          echo "执行 goimports 格式化..."
          goimports -w .

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ 存在未格式化的代码文件："
            gofmt -l .
            exit 1
          fi

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Run Unit Test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Build Go binary
        run: |
          mkdir -p artifacts
          go build -o artifacts/go-admin ./...

      - name: Upload Go binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-admin-binary
          path: artifacts/

      # ============== 镜像构建推送 ==============

      - name: Login to Aliyun ACR
        if: github.event_name == 'push'
        uses: aliyun/acr-login@v1
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ACR_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ACR_ACCESS_KEY_SECRET }}
        with:
          registry: ${{ env.ACR_REGISTRY }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          FULL_NAME="${ACR_REGISTRY}/${IMAGE_REPO}"
          TAGS="${FULL_NAME}:${SHORT_SHA} ${FULL_NAME}:latest"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            TAGS="$TAGS ${FULL_NAME}:${VERSION}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify Dockerfile exists
        if: github.event_name == 'push'
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ 仓库根目录未找到 Dockerfile"
            exit 1
          fi

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.short_sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
