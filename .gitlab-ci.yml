stages:
  - lint
  - test
  - build
  - scan
  - push

variables:
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"

lint:
  stage: lint
  script:
    - go vet ./... 2>&1 || true
    - echo "Lint done"
  allow_failure: true

test:
  stage: test
  script:
    - go test ./... -v -cover 2>&1 || true
    - echo "Test done"
  allow_failure: true

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_NAME}:latest
    - docker images ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} --format "Size: {{.Size}}"
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -o go-admin-image.tar
  artifacts:
    paths:
      - go-admin-image.tar
    expire_in: 1 hour

scan:
  stage: scan
  script:
    - which trivy || (curl -sfL https://mirrors.aliyun.com/trivy/trivy_0.55.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz && tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy)
    - docker load -i go-admin-image.tar
    - trivy image --exit-code 1 --severity CRITICAL ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
    - trivy image --format json -o trivy-report.json ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
    - echo "Scan done"
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 7 days
  allow_failure: true

push:
  stage: push
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker load -i go-admin-image.tar
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest
    - echo "Pushed: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
  only:
    - main
